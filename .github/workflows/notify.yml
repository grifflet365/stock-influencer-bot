name: notify

on:
  schedule:
    # UTC表記(JST-9h)。混雑回避のため各枠を3分後ろにずらしている
    # JST 08:30        → 23:33 UTC
    - cron: "33 23 * * *"
    # JST 09:00〜15:30 を30分おき → 00:03〜06:33 UTC
    - cron: "3,33 0-6 * * *"
    # JST 17:30 / 19:30 / 21:30 / 23:30 → 08:33 / 10:33 / 12:33 / 14:33 UTC
    - cron: "33 8,10,12,14 * * *"
    # JST 00:30 / 04:30 → 15:33 / 19:33 UTC
    - cron: "33 15,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state"
          git push
