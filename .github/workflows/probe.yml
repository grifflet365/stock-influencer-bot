name: probe

# advanced_searchの時間絞り込みの調査用。手動実行のみ(最悪約1,200クレジット消費)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        run: python probe.py
